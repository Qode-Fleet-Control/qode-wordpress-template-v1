# fleet.conf - app manifest. Sourced (as shell) by the lifecycle scripts
# (bin/run bin/start bin/restart bin/reload bin/stop). $PORT is available
# inside every command. An empty command skips that step.

NAME="WordPress Template"
PORT="8080"
# The front page: 200 once docker/entrypoint.sh has run `wp core install` (no wizard).
HEALTH_PATH="/"

# Without docker (FLEET_RUNTIME=process): needs PHP 8.x with mysqli, wp-cli (`wp`) and a
# reachable MySQL/MariaDB (WORDPRESS_DB_HOST/NAME/USER/PASSWORD) — the fleet provides none.
# Core is downloaded into the repo root (gitignored); PHP's built-in server serves it.
INSTALL_CMD='wp core download --version=7.1.2 --skip-content --force'
BUILD_CMD='mkdir -p private && ( wp core is-installed || wp core install --url="http://localhost:$PORT" --title=WordPress --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email )'
START_CMD='php -S 0.0.0.0:$PORT'
RELOAD_CMD=''

# --- docker runtime (compose.yaml) ---------------------------------------------
# How the fleet runs the app: as containers, in the coordinator's private docker. These
# REPLACE the commands above, which stay for the QA tester's self-host and for local work
# without docker (`FLEET_RUNTIME=process bin/run`). START runs compose in the FOREGROUND
# so the fleet's stop can end it. See bin/_common.sh.
DOCKER_BUILD_CMD='docker compose build'
DOCKER_START_CMD='docker compose up --remove-orphans'
DOCKER_RELOAD_CMD=''
